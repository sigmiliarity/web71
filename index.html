<!doctype html>
<html lang="en">
<head><script>
(function() {
  const CHUNK_SIZE = 26214400; // 25 MB per chunk
  const TOTAL_CHUNKS = 259;
  const TOTAL_SIZE = CHUNK_SIZE * TOTAL_CHUNKS;

  // 1. Core chunk stitching function
  async function fetchVirtualRange(start, end) {
    const contentLength = (end - start) + 1;
    const startChunkIdx = Math.floor(start / CHUNK_SIZE);
    const endChunkIdx = Math.floor(end / CHUNK_SIZE);
    const slicedBuffer = new Uint8Array(contentLength);
    let offset = 0;

    for (let i = startChunkIdx; i <= endChunkIdx; i++) {
      const chunkNumber = i + 1;
      const chunkUrl = new URL(`./game/${chunkNumber}.data`, window.location.href).href;
      
      const chunkGlobalStart = i * CHUNK_SIZE;
      const localStart = Math.max(0, start - chunkGlobalStart);
      const localEnd = Math.min(CHUNK_SIZE - 1, end - chunkGlobalStart);

      const res = await window.fetch(chunkUrl, {
        cache: "no-store",
        headers: { Range: `bytes=${localStart}-${localEnd}` }
      });

      if (!res.ok && res.status !== 206) {
        throw new Error(`Chunk ${chunkNumber} failed with status ${res.status}`);
      }

      const buf = await res.arrayBuffer();
      const actualLen = buf.byteLength;
      let targetBytes;

      if (res.status === 206) {
        targetBytes = new Uint8Array(buf);
      } else {
        const safeStart = Math.min(localStart, actualLen);
        const safeEnd = Math.min(localEnd, actualLen - 1);
        const safeLen = Math.max(0, (safeEnd - safeStart) + 1);
        targetBytes = new Uint8Array(buf, safeStart, safeLen);
      }

      const writeLen = Math.min(targetBytes.byteLength, contentLength - offset);
      if (writeLen > 0) {
        slicedBuffer.set(targetBytes.subarray(0, writeLen), offset);
        offset += writeLen;
      }
    }
    return slicedBuffer;
  }

  // 2. Intercept global fetch() to virtualize game.data requests
  const originalFetch = window.fetch;
  window.fetch = async function(resource, init) {
    let url = typeof resource === 'string' ? resource : resource?.url;
    if (url && (url.endsWith('/game.data') || url === 'game.data' || url.includes('game.data'))) {
      const rangeHeader = init?.headers?.Range || init?.headers?.get?.('Range');
      if (rangeHeader) {
        const match = rangeHeader.match(/bytes=(\d+)-(\d+)/);
        if (match) {
          const start = parseInt(match[1], 10);
          const end = parseInt(match[2], 10);
          try {
            const bytes = await fetchVirtualRange(start, end);
            return new Response(bytes, {
              status: 206,
              headers: {
                'Content-Type': 'application/octet-stream',
                'Content-Range': `bytes ${start}-${end}/${TOTAL_SIZE}`,
                'Content-Length': bytes.length.toString(),
                'Accept-Ranges': 'bytes'
              }
            });
          } catch (err) {
            return new Response("game.data read failed", { status: 500 });
          }
        }
      }
    }
    return originalFetch.apply(this, arguments);
  };

  // 3. Intercept global XMLHttpRequest (used by readSync)
  const originalXhrOpen = XMLHttpRequest.prototype.open;
  const originalXhrSend = XMLHttpRequest.prototype.send;
  const originalXhrSetHeader = XMLHttpRequest.prototype.setRequestHeader;

  XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
    this._isGameData = url && (url.endsWith('/game.data') || url === 'game.data' || url.includes('game.data'));
    this._rangeHeader = null;
    return originalXhrOpen.apply(this, arguments);
  };

  XMLHttpRequest.prototype.setRequestHeader = function(header, value) {
    if (this._isGameData && header.toLowerCase() === 'range') {
      this._rangeHeader = value;
    }
    return originalXhrSetHeader.apply(this, arguments);
  };

  XMLHttpRequest.prototype.send = function(body) {
    if (this._isGameData && this._rangeHeader) {
      const xhr = this;
      const match = this._rangeHeader.match(/bytes=(\d+)-(\d+)/);
      if (match) {
        const start = parseInt(match[1], 10);
        const end = parseInt(match[2], 10);

        fetchVirtualRange(start, end).then(bytes => {
          Object.defineProperties(xhr, {
            status: { value: 206, writable: true },
            statusText: { value: "Partial Content", writable: true },
            responseText: { value: String.fromCharCode.apply(null, bytes), writable: true },
            response: { value: bytes.buffer, writable: true },
            readyState: { value: 4, writable: true }
          });
          if (typeof xhr.onload === 'function') xhr.onload();
          if (typeof xhr.onreadystatechange === 'function') xhr.onreadystatechange();
        }).catch(() => {
          Object.defineProperties(xhr, {
            status: { value: 500, writable: true },
            readyState: { value: 4, writable: true }
          });
          if (typeof xhr.onerror === 'function') xhr.onerror();
        });
        return;
      }
    }
    return originalXhrSend.apply(this, arguments);
  };

  // 4. Trap MCSMFiles definition and disable its isolated worker thread
  let _mcsmRef = null;
  Object.defineProperty(window, 'MCSMFiles', {
    configurable: true,
    enumerable: true,
    get() { return _mcsmRef; },
    set(v) {
      _mcsmRef = v;
      if (v) {
        // Forces fallback to main-thread drain() where our fetch interceptor works
        v.helper = function() { return null; };
      }
    }
  });
})();
</script>

#options{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);width:max-content;max-width:92vw;box-sizing:border-box;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;padding:12px 18px;border-radius:10px;background:rgba(10,14,24,.66);color:#c9d2e6;font:13px Rubik,system-ui,sans-serif;font-size:clamp(13px,1.6vh,20px)}

#options label{display:flex;flex-direction:column;gap:4px}
#options select{background:#111;color:#ddd;border:1px solid #333;border-radius:4px;padding:5px 8px;font:inherit;cursor:pointer}

</style>
